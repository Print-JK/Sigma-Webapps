<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundCraft — Digital Audio Workstation</title>
  <link rel="stylesheet" href="../assets/modern-theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top App Navigation & Transport Bar -->
  <header class="daw-header">
    <div class="daw-brand">
      <a href="../index.html" class="transport-btn" style="width: auto; padding: 0 10px; font-size: 0.8rem;" title="Back to Sigma Home">← Home</a>
      <div style="font-weight: 700; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 6px;">
        <span style="color: #10b981;">🎚️</span> SoundCraft <span style="font-size: 0.72rem; color: #10b981; border: 1px solid rgba(16,185,129,0.3); border-radius: 9999px; padding: 2px 8px;">Studio</span>
      </div>
      <input type="text" id="projectTitle" value="Untitled Session" style="background: transparent; border: 1px solid transparent; color: #fff; font-size: 0.95rem; font-weight: 600; padding: 4px 8px; border-radius: 4px; width: 160px;" />
    </div>

    <!-- Transport Controls -->
    <div class="transport-bar">
      <button id="btnRewind" class="transport-btn" title="Rewind to Start (Home)">|◀</button>
      <button id="btnPlayPause" class="transport-btn play-btn" title="Play / Pause (Space)">▶</button>
      <button id="btnStop" class="transport-btn" title="Stop">■</button>
      <button id="btnRecord" class="transport-btn record-btn" title="Record Live Microphone">●</button>
      <button id="btnLoop" class="transport-btn" title="Toggle Loop Mode">⟳</button>
      <div id="timecodeDisplay" class="timecode-display">00:00:00</div>
    </div>

    <!-- Actions & Export -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button id="btnImportAudio" class="transport-btn" style="width: auto; padding: 0 12px; font-size: 0.8rem;" title="Import Audio File">+ Audio</button>
      <input type="file" id="audioFileInput" accept="audio/*" style="display: none;" />

      <button id="btnSplitClip" class="transport-btn" style="width: auto; padding: 0 10px; font-size: 0.8rem;" title="Split Selected Clip at Playhead (S)">✂ Split (S)</button>
      <button id="btnDeleteClip" class="transport-btn" style="width: auto; padding: 0 10px; font-size: 0.8rem; color: #ef4444;" title="Delete Selected Clip (Del)">🗑</button>
      <button id="btnExportWav" class="transport-btn" style="width: auto; padding: 0 14px; font-size: 0.82rem; background: #10b981; color: #000; font-weight: 700;" title="Render & Export Master Audio (.wav)">⚡ Export WAV</button>
    </div>
  </header>

  <!-- Studio Main Layout -->
  <div class="studio-layout">
    <!-- Upper Deck: Visualizer & Master Effects Rack -->
    <div class="upper-deck">
      <!-- Master FFT Visualizer -->
      <div class="visualizer-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span style="font-size: 0.72rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em;">MASTER SPECTRUM</span>
          <span id="peakLevelText" style="font-size: 0.7rem; font-family: var(--font-mono); color: #10b981;">-inf dB</span>
        </div>
        <canvas id="masterVisualizer" class="visualizer-canvas" width="290" height="110"></canvas>
      </div>

      <!-- Effects Rack -->
      <div class="effects-rack">
        <!-- 3-Band Parametric EQ -->
        <div class="rack-module">
          <div class="rack-title">3-BAND EQUALIZER</div>
          <div class="rack-controls">
            <div class="slider-vertical">
              <input type="range" id="eqLow" min="-12" max="12" value="0" step="0.5" />
              <span>Low</span>
            </div>
            <div class="slider-vertical">
              <input type="range" id="eqMid" min="-12" max="12" value="0" step="0.5" />
              <span>Mid</span>
            </div>
            <div class="slider-vertical">
              <input type="range" id="eqHigh" min="-12" max="12" value="0" step="0.5" />
              <span>High</span>
            </div>
          </div>
        </div>

        <!-- Space Reverb -->
        <div class="rack-module">
          <div class="rack-title">SPACE REVERB / DELAY</div>
          <div class="rack-controls">
            <div class="slider-vertical">
              <input type="range" id="reverbTime" min="0.1" max="2.0" value="0.4" step="0.05" />
              <span>Time</span>
            </div>
            <div class="slider-vertical">
              <input type="range" id="reverbWet" min="0" max="1" value="0.15" step="0.05" />
              <span>Wet</span>
            </div>
          </div>
        </div>

        <!-- Master Output -->
        <div class="rack-module">
          <div class="rack-title">MASTER OUT</div>
          <div class="rack-controls">
            <div class="slider-vertical">
              <input type="range" id="masterVolume" min="0" max="1.5" value="1.0" step="0.01" />
              <span>Gain</span>
            </div>
            <div class="limiter-controls">
              <label><input type="checkbox" id="limiterEnabled" checked /> Limiter</label>
              <input type="range" id="limiterCeiling" min="-12" max="-0.1" value="-1" step="0.1" aria-label="Limiter ceiling in dBFS" />
              <span id="limiterCeilingLabel">−1 dBFS</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lower Deck: Multi-Track Timeline -->
    <div class="timeline-section">
      <div class="timeline-workspace">
        <!-- Track Headers Column -->
        <div class="track-headers-column">
          <div style="height: 24px; padding: 4px 12px; font-size: 0.7rem; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.08);">
            TRACKS
          </div>

          <!-- Track 0 Header -->
          <div class="track-header-item" id="header_0">
            <div class="track-header-top">
              <span class="track-name">Track 1</span>
              <div class="track-toggles">
                <button class="track-toggle-btn mute" data-track="0">M</button>
                <button class="track-toggle-btn solo" data-track="0">S</button>
                <button class="track-toggle-btn record-arm" data-track="0" title="Record arm">R</button>
              </div>
            </div>
            <div class="track-sliders">
              <span>Vol</span><input type="range" class="track-vol" data-track="0" min="0" max="1.5" value="1" step="0.01" />
              <span>Pan</span><input type="range" class="track-pan" data-track="0" min="-1" max="1" value="0" step="0.05" />
            </div>
          </div>

          <!-- Track 1 Header -->
          <div class="track-header-item" id="header_1">
            <div class="track-header-top">
              <span class="track-name">Track 2</span>
              <div class="track-toggles">
                <button class="track-toggle-btn mute" data-track="1">M</button>
                <button class="track-toggle-btn solo" data-track="1">S</button>
                <button class="track-toggle-btn record-arm" data-track="1" title="Record arm">R</button>
              </div>
            </div>
            <div class="track-sliders">
              <span>Vol</span><input type="range" class="track-vol" data-track="1" min="0" max="1.5" value="1" step="0.01" />
              <span>Pan</span><input type="range" class="track-pan" data-track="1" min="-1" max="1" value="0" step="0.05" />
            </div>
          </div>

          <!-- Track 2 Header -->
          <div class="track-header-item" id="header_2">
            <div class="track-header-top">
              <span class="track-name">Track 3</span>
              <div class="track-toggles">
                <button class="track-toggle-btn mute" data-track="2">M</button>
                <button class="track-toggle-btn solo" data-track="2">S</button>
                <button class="track-toggle-btn record-arm" data-track="2" title="Record arm">R</button>
              </div>
            </div>
            <div class="track-sliders">
              <span>Vol</span><input type="range" class="track-vol" data-track="2" min="0" max="1.5" value="1" step="0.01" />
              <span>Pan</span><input type="range" class="track-pan" data-track="2" min="-1" max="1" value="0" step="0.05" />
            </div>
          </div>

          <!-- Track 3 Header -->
          <div class="track-header-item" id="header_3">
            <div class="track-header-top">
              <span class="track-name">Track 4 (Vocals)</span>
              <div class="track-toggles">
                <button class="track-toggle-btn mute" data-track="3">M</button>
                <button class="track-toggle-btn solo" data-track="3">S</button>
                <button class="track-toggle-btn record-arm" data-track="3" title="Record arm">R</button>
              </div>
            </div>
            <div class="track-sliders">
              <span>Vol</span><input type="range" class="track-vol" data-track="3" min="0" max="1.5" value="1" step="0.01" />
              <span>Pan</span><input type="range" class="track-pan" data-track="3" min="-1" max="1" value="0" step="0.05" />
            </div>
          </div>
        </div>

        <!-- Tracks Canvas & Timeline -->
        <div class="tracks-scroll-area" id="tracksScrollArea">
          <div class="tracks-canvas-container" id="tracksCanvasContainer">
            <!-- Timeline Ruler -->
            <div class="timeline-ruler" id="timelineRuler"></div>

            <!-- Track Lanes -->
            <div class="track-lane" id="trackLane_0" data-track="0"></div>
            <div class="track-lane" id="trackLane_1" data-track="1"></div>
            <div class="track-lane" id="trackLane_2" data-track="2"></div>
            <div class="track-lane" id="trackLane_3" data-track="3"></div>

            <!-- Playhead -->
            <div class="timeline-playhead" id="playhead">
              <div class="playhead-handle"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
