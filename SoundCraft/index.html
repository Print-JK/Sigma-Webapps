<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>SoundCraft</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1f22; }
    #soundcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #soundcraft_loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, -apple-system, sans-serif; pointer-events: none; z-index: 5;
    }
    .sigma-home-pill {
      position: fixed; bottom: 26px; right: 12px; z-index: 9999;
      padding: 5px 12px; border-radius: 999px; font: 600 12px system-ui, -apple-system, sans-serif;
      color: rgba(245,245,247,0.88); text-decoration: none;
      background: rgba(28,28,36,0.78); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4); opacity: 0.45; transition: opacity 0.2s, transform 0.2s;
    }
    .sigma-home-pill:hover { opacity: 1; transform: translateY(-1px); color: #fff; }
  </style>
</head>
<body>
  <canvas id="soundcraft_canvas"></canvas>
  <script>
    // cpal (wasm) builds the output stream at startup, before any user gesture, so the
    // WebAudio AudioContext stays 'suspended': no audio is heard and the transport clock
    // (driven by the audio callback) never advances. Capture the AudioContext cpal creates
    // and resume it on the first user gesture. Runs before the wasm module is instantiated.
    (function () {
      var Orig = window.AudioContext || window.webkitAudioContext;
      if (!Orig) return;
      var ctxs = [];
      function Wrapped(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
      Wrapped.prototype = Orig.prototype;
      window.AudioContext = Wrapped;
      if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
      function resumeAll() {
        ctxs.forEach(function (c) { if (c.state === 'suspended') { c.resume().catch(function () {}); } });
      }
      ['pointerdown', 'mousedown', 'touchstart', 'keydown'].forEach(function (ev) {
        window.addEventListener(ev, resumeAll, { capture: true });
      });
    })();
  </script>
  <div id="soundcraft_loading">Loading SoundCraft&hellip;</div>
  <a href="../Main/index.html" class="sigma-home-pill" title="Back to Sigma Webapps">⌂ Home</a>
  <script src="soundcraft-web.js"></script>
  <script>
    (async function bootSoundCraft() {
      const loadingEl = document.getElementById("soundcraft_loading");
      if (!location.search.includes("webgl")) {
        let useWebGL = false;
        try {
          const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
          if (!adapter) useWebGL = true;
        } catch (_) { useWebGL = true; }
        if (useWebGL) {
          try {
            const u = new URL(location.href);
            u.searchParams.set("webgl", "1");
            history.replaceState(null, "", u.toString());
          } catch (_) {}
        }
      }
      async function decodeGzipB64(b64) {
        const bin = atob(b64);
        const gzBytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) gzBytes[i] = bin.charCodeAt(i);
        const ds = new DecompressionStream("gzip");
        const writer = ds.writable.getWriter();
        writer.write(gzBytes);
        writer.close();
        const buf = await new Response(ds.readable).arrayBuffer();
        return new Uint8Array(buf);
      }
      async function loadInlineFallback() {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "soundcraft_wasm_gz.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        const bytes = await decodeGzipB64(window.__WASM_GZ_B64);
        delete window.__WASM_GZ_B64;
        await wasm_bindgen(bytes);
      }
      try {
        if (location.protocol === "file:") {
          await loadInlineFallback();
        } else {
          try {
            await wasm_bindgen("./soundcraft-web_bg.wasm");
          } catch (_) {
            await loadInlineFallback();
          }
        }
      } catch (err) {
        console.error("Failed to start SoundCraft:", err);
        if (loadingEl) loadingEl.textContent = "Failed to start SoundCraft: " + (err && err.message || err);
      }
    })();
  </script>
</body>
</html>
