<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FilePrev — Local File Previewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="../assets/modern-theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Pill Bar -->
  <div class="top-bar-container">
    <div class="nav-pill-bar">
      <button type="button" class="nav-pill-item mobile-only nav-pill-btn" id="sidebarToggleBtn" title="Toggle File Drawer">
        ☰ Files
      </button>
      <a href="../index.html" class="nav-pill-item" title="Back to Sigma Home">⌂ Home</a>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span class="nav-pill-item active">📂 FilePrev</span>
      <a class="nav-pill-item" href="SpeedReader/index.html" title="Launch SpeedReader">⚡ SpeedReader</a>
      <span style="color: rgba(255,255,255,0.2);" class="nav-pipe-mobile-hide">|</span>
      <span class="status-indicator">
        <span class="status-dot online"></span>
        <span style="font-size: 0.8rem; color: var(--text-muted);" class="hide-mobile">Local Offline</span>
      </span>
    </div>
  </div>

  <div class="app-body">
    <!-- Sidebar -->
    <aside class="sidebar glass-card" id="sidebar">
      <div class="sidebar-header-row">
        <span class="sidebar-title">LOADED FILES</span>
        <span id="fileCountBadge" class="badge">0</span>
      </div>
      <div class="sidebar-upload-actions">
        <button class="btn btn-primary" onclick="document.getElementById('singleInput').click()" title="Choose a single file">
          📄 Choose File
        </button>
        <button class="btn btn-secondary" onclick="document.getElementById('folderInput').click()" title="Choose an entire directory">
          📁 Folder
        </button>
        <input type="file" id="singleInput" onchange="handleSingleFile(event)" style="display:none;" />
        <input type="file" id="folderInput" webkitdirectory directory multiple onchange="handleFolderFiles(event)" style="display:none;" />
      </div>
      <div class="file-tree" id="fileTree">
        <div class="empty-file-hint">Drop files or folders anywhere to preview.</div>
      </div>
    </aside>

    <!-- Viewport -->
    <main class="viewport glass-card" id="viewportArea">
      <div class="viewport-header" id="viewportHeader">
        <div class="file-info">
          <span class="file-name" id="selectedFileName">No File Selected</span>
          <span class="file-meta" id="selectedFileMeta"></span>
        </div>
        <div class="viewport-actions" id="viewportActions">
          <button id="downloadCurrentBtn" class="btn btn-secondary btn-icon hidden" title="Download Current File">💾</button>
        </div>
      </div>

      <div class="preview-stage" id="previewStage">
        <div class="placeholder">
          <div class="drop-icon">📂</div>
          <h3>Select a file or drop files here</h3>
          <p>Supports PNG, JPG, GIF, WebP, SVG, PSD (with layered inspection), MP4, MP3, PDF, CSV, Markdown, and text formats.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/liquid-glass.js" defer></script>
  <script src="../lib/jszip.min.js"></script>
  <script src="FilePrev.js"></script>
</body>
</html>
