<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PhotoCraft</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #photocraft_loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, -apple-system, sans-serif; pointer-events: none; z-index: 5;
    }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    #photocraft_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
    .sigma-home-pill {
      position: fixed; bottom: 26px; right: 12px; z-index: 9999;
      padding: 5px 12px; border-radius: 999px; font: 600 12px system-ui, -apple-system, sans-serif;
      color: rgba(245,245,247,0.88); text-decoration: none;
      background: rgba(28,28,36,0.78); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4); opacity: 0.45; transition: opacity 0.2s, transform 0.2s;
    }
    .sigma-home-pill:hover { opacity: 1; transform: translateY(-1px); color: #fff; }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading">
    <p>Loading PhotoCraft&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If PhotoCraft doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
  <a href="../Main/index.html" class="sigma-home-pill" title="Back to Sigma Webapps">⌂ Home</a>
  <script src="photocraft-web.js"></script>
  <script>
    (async function bootPhotoCraft() {
      const loadingEl = document.getElementById("photocraft_loading");
      if (!location.search.includes("webgl")) {
        let useWebGL = false;
        try {
          const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
          if (!adapter) useWebGL = true;
        } catch (_) { useWebGL = true; }
        if (useWebGL) {
          try {
            const u = new URL(location.href);
            u.searchParams.set("webgl", "1");
            history.replaceState(null, "", u.toString());
          } catch (_) {}
        }
      }
      async function decodeGzipB64(b64) {
        const bin = atob(b64);
        const gzBytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) gzBytes[i] = bin.charCodeAt(i);
        const ds = new DecompressionStream("gzip");
        const writer = ds.writable.getWriter();
        writer.write(gzBytes);
        writer.close();
        const buf = await new Response(ds.readable).arrayBuffer();
        return new Uint8Array(buf);
      }
      async function loadInlineFallback() {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "photocraft_wasm_gz.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        const bytes = await decodeGzipB64(window.__WASM_GZ_B64);
        delete window.__WASM_GZ_B64;
        await wasm_bindgen(bytes);
      }
      try {
        if (location.protocol === "file:") {
          await loadInlineFallback();
        } else {
          try {
            await wasm_bindgen("./photocraft-web_bg.wasm");
          } catch (_) {
            await loadInlineFallback();
          }
        }
        window.__sigmaCraftReady = true;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: "sigma-craft-ready", app: "PhotoCraft" }, "*");
        }
        if (window.__sigmaPendingDrop) {
          const f = window.__sigmaPendingDrop;
          delete window.__sigmaPendingDrop;
          setTimeout(() => window.__sigmaDispatchDrop(f), 450);
        }
      } catch (err) {
        console.error("Failed to start PhotoCraft:", err);
        if (loadingEl) loadingEl.textContent = "Failed to start PhotoCraft: " + (err && err.message || err);
      }
    })();
    window.__sigmaDispatchDrop = function(f) {
      const canvas = document.getElementById("photocraft_canvas");
      if (!canvas || !f) return;
      const dt = new DataTransfer();
      dt.items.add(new File([f.buffer], f.name, { type: f.mime || "application/octet-stream" }));
      canvas.focus();
      canvas.dispatchEvent(new DragEvent("drop", { bubbles: true, cancelable: true, dataTransfer: dt }));
    };
    window.addEventListener("message", (ev) => {
      if (ev.data && ev.data.type === "sigma-craft-open-file") {
        if (window.__sigmaCraftReady) setTimeout(() => window.__sigmaDispatchDrop(ev.data), 250);
        else window.__sigmaPendingDrop = ev.data;
      }
    });
  </script>
</body>
</html>
