<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PdfCraft — PDF Workbench</title>
  <link rel="stylesheet" href="../assets/modern-theme.css" />
  <link rel="stylesheet" href="style.css" />

  <script src="../lib/pdf.min.js"></script>
  <script src="../lib/pdf-lib.min.js"></script>
</head>
<body>

  <!-- App Header & Top Menu -->
  <header class="craft-header">
    <div class="craft-brand">
      <a href="../index.html" class="nav-pill-item" title="Back to Sigma Home" style="padding: 4px 10px;">⌂ Home</a>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <div class="craft-logo">📄 Pdf<span>Craft</span></div>
    </div>

    <div class="craft-menu-bar">
      <button class="menu-btn" id="openFileBtn">📂 Open PDF</button>
      <button class="menu-btn" id="mergeFileBtn">🧩 Merge Another PDF</button>
      <button class="menu-btn" id="savePdfBtn" style="color: #34d399; font-weight: 600;">💾 Export PDF</button>
      <input type="file" id="fileInput" accept=".pdf" style="display:none;" />
      <input type="file" id="mergeInput" accept=".pdf" style="display:none;" />
    </div>

    <div>
      <span class="status-indicator">
        <span class="status-dot online"></span>
        <span style="font-size: 0.8rem; color: var(--text-muted);">100% Client-Side</span>
      </span>
    </div>
  </header>

  <!-- Secondary Tools & Annotation Bar -->
  <div class="craft-toolbar">
    <div class="toolbar-group">
      <button class="tool-btn" id="toggleSidebarBtn" title="Toggle Thumbnails Panel">📑 Thumbnails</button>
      <div class="toolbar-separator"></div>
      <button class="tool-btn active" id="tool_select" title="Selection / Pan Tool">🖐️ Select</button>
      <button class="tool-btn" id="tool_highlight" title="Highlight Tool">🖍️ Highlight</button>
      <button class="tool-btn" id="tool_pen" title="Freehand Pen Tool">✏️ Pen</button>
      <button class="tool-btn" id="tool_rect" title="Rectangle Shape">⬜ Box</button>
      <button class="tool-btn" id="tool_text" title="Text Note">🔤 Text</button>
    </div>

    <div class="toolbar-group">
      <button class="tool-btn" id="zoomOutBtn" title="Zoom Out">−</button>
      <select id="zoomSelect" class="form-control" style="width: auto; padding: 4px 8px; font-size: 0.8rem;">
        <option value="0.75">75%</option>
        <option value="1.0">100%</option>
        <option value="1.25" selected>125%</option>
        <option value="1.5">150%</option>
        <option value="2.0">200%</option>
      </select>
      <button class="tool-btn" id="zoomInBtn" title="Zoom In">+</button>
    </div>
  </div>

  <!-- Main Layout -->
  <div class="craft-workspace">
    <!-- Left Thumbnails Sidebar -->
    <aside class="craft-sidebar" id="craftSidebar">
      <div class="sidebar-header">
        <span>PAGES</span>
      </div>
      <div class="thumbnails-scroll" id="thumbnailsScroll">
        <!-- Dynamically rendered thumbnails -->
      </div>
    </aside>

    <!-- Center Viewport -->
    <main class="craft-viewport" id="viewport">
      <div class="empty-workbench" id="emptyState">
        <div class="icon">📑</div>
        <h2>Welcome to PdfCraft</h2>
        <p>An open-source, local-first PDF workbench. Open a PDF document to read, organize, rotate, annotate, and export.</p>
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">Open PDF File</button>
      </div>

      <div class="pdf-page-container" id="pageContainer" style="display:none;">
        <canvas id="pdfCanvas"></canvas>
        <canvas id="annotationCanvas"></canvas>
      </div>

      <!-- Floating Bottom Navigation Bar -->
      <div class="viewport-bottom-bar" id="bottomBar">
        <button class="tool-btn" id="prevPageBtn" title="Previous Page">◀</button>
        <span class="page-indicator" id="pageIndicator">Page 1 of 1</span>
        <button class="tool-btn" id="nextPageBtn" title="Next Page">▶</button>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
