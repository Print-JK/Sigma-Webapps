<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RadioLocal — Local Audio Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <link rel="stylesheet" href="../assets/modern-theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top Navigation Pill Bar -->
  <div class="top-bar-container">
    <div class="nav-pill-bar">
      <a href="../index.html" class="nav-pill-item" title="Back to Sigma Home">⌂ Home</a>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span class="nav-pill-item active">🎵 RadioLocal</span>
      <span style="color: rgba(255,255,255,0.2);">|</span>
      <span class="status-indicator">
        <span class="status-dot online"></span>
        <span style="font-size: 0.8rem; color: var(--text-muted);">Web Audio API</span>
      </span>
    </div>
  </div>

  <div id="wrapper">
    <!-- Dark Backdrop Overlay -->
    <div class="overlay" id="overlay" onclick="toggleOffCanvas()"></div>

    <!-- Off-Canvas Sidebar -->
    <nav class="navbar fixed-top glass-card" id="sidebar-wrapper" role="navigation">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span>🎵 Radio<span>Local</span></span>
        </div>
      </div>

      <!-- Upload Controls & Dropzone -->
      <div class="sidebar-content-padding">
        <div class="dropzone compact" id="dropzone" onclick="document.getElementById('singleInput').click()">
          <p>Drop audio or <span class="browse-link">browse</span></p>
          <span class="sidebar-label" style="display:block; margin-top: 4px;">MP3, WAV, OGG, AAC, FLAC, M4A</span>
        </div>

        <div class="upload-buttons">
          <button class="btn btn-secondary" onclick="document.getElementById('singleInput').click()">📄 File</button>
          <button class="btn btn-secondary" onclick="document.getElementById('folderInput').click()">📁 Folder</button>
          <input type="file" id="singleInput" accept="audio/*" multiple onchange="handleFileSelect(event)" class="hidden">
          <input type="file" id="folderInput" webkitdirectory directory multiple onchange="handleFileSelect(event)" class="hidden">
        </div>

        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Filter playlist (e.g. Queen, Jazz)…" oninput="handleSearch(event)">
        </div>

        <div class="sidebar-header-row">
          <span class="sidebar-label" id="playlistCountLabel">Tracks (0)</span>
          <button class="text-btn" onclick="clearPlaylist()">Clear All</button>
        </div>

        <div class="file-list" id="fileList">
          <div class="empty-state">No tracks loaded yet.</div>
        </div>
      </div>
    </nav>
    <!-- /#sidebar-wrapper -->

    <!-- Page Content -->
    <div id="page-content-wrapper">
      <!-- Animated Hamburger Button -->
      <button type="button" class="hamburger is-closed" id="hamburgerBtn" onclick="toggleOffCanvas()" title="Toggle Playlist Drawer">
        <span class="hamb-top"></span>
        <span class="hamb-middle"></span>
        <span class="hamb-bottom"></span>
      </button>

      <!-- Main Stage Viewport -->
      <main class="workspace-main">
        <div class="now-playing-hero glass-card" id="heroDropZone">
          <div class="cover-art-container">
            <canvas id="visualizerCanvas" width="340" height="340"></canvas>
            <div class="cover-placeholder" id="coverPlaceholder">🎵</div>
          </div>

          <div class="track-details">
            <div class="badge-row">
              <span class="badge badge-accent" id="nowPlayingBadge">READY</span>
              <span class="badge" id="eqBadge">Flat EQ</span>
            </div>
            <h1 id="heroTrackTitle">No Track Selected</h1>
            <p id="heroTrackArtist">Upload audio files or click the playlist icon top-left to begin playback</p>
            <p id="heroTrackMeta" class="meta-text">-</p>

            <div class="quick-controls" style="margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
              <select id="eqSelect" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onchange="changeEQ(event)">
                <option value="flat">Flat EQ</option>
                <option value="bass">Bass Boost</option>
                <option value="treble">Treble Boost</option>
                <option value="vocal">Vocal Enhance</option>
              </select>

              <select id="vizSelect" class="form-control" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onchange="changeVisualizer(event)">
                <option value="circular">Circular Wave</option>
                <option value="bars">Frequency Bars</option>
                <option value="pulse">Ambient Pulse</option>
              </select>
            </div>
          </div>
        </div>
      </main>
    </div>
    <!-- /#page-content-wrapper -->

  </div>
  <!-- /#wrapper -->

  <!-- Persistent Bottom Glassmorphic Playback Bar (Dribbble media card inspired) -->
  <footer class="player-bar glass-card">
    <div class="player-left">
      <div class="mini-art" id="miniArt">🎵</div>
      <div class="mini-info">
        <div class="mini-title" id="miniTitle">Not Playing</div>
        <div class="mini-artist" id="miniArtist">-</div>
      </div>
    </div>

    <div class="player-center">
      <div class="control-buttons">
        <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">🔀</button>
        <button class="control-btn" onclick="playPreviousTrack()" title="Previous">⏮</button>
        <button class="control-btn play-pause-btn" id="playPauseBtn" onclick="togglePlayPause()" title="Play/Pause">▶</button>
        <button class="control-btn" onclick="playNextTrack()" title="Next">⏭</button>
        <button class="control-btn" id="repeatBtn" onclick="toggleRepeat()" title="Repeat">🔁</button>
      </div>

      <div class="playback-timeline">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" value="0" min="0" max="100" oninput="seekAudio(event)">
        <span id="durationTime">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="control-btn" id="muteBtn" onclick="toggleMute()" title="Mute/Unmute">🔊</button>
      <input type="range" id="volumeBar" value="100" min="0" max="100" oninput="adjustVolume(event)">
    </div>
  </footer>

  <audio id="audioEngine"></audio>
  <script src="RadioLocal.js"></script>
</body>
</html>
