<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>FilmCraft</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1c1f; }
    canvas#filmcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; color: #c9c9cc;
      font: 14px/1.4 system-ui, -apple-system, sans-serif; pointer-events: none; z-index: 5;
    }
    #loading .err { color: #ff8a7a; white-space: pre-wrap; max-width: 70ch; pointer-events: auto; }
    #fatal {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(20, 20, 22, 0.88); color: #e6e6e8; font: 14px/1.45 system-ui, sans-serif; z-index: 10;
    }
    #fatal.on { display: flex; }
    #fatal .box { max-width: min(78ch, calc(100vw - 32px)); padding: 20px 24px; background: #26272b; border-radius: 8px; }
    #fatal h1 { margin: 0 0 8px; font-size: 17px; color: #ff8a7a; }
    #fatal pre { max-height: 40vh; overflow: auto; white-space: pre-wrap; font-size: 12px; color: #c9c9cc; }
    #fatal button { font: inherit; padding: 6px 14px; border: 0; border-radius: 6px; background: #3b6fe0; color: #fff; cursor: pointer; }
    .sigma-home-pill {
      position: fixed; bottom: 26px; right: 12px; z-index: 9999;
      padding: 5px 12px; border-radius: 999px; font: 600 12px system-ui, -apple-system, sans-serif;
      color: rgba(245,245,247,0.88); text-decoration: none;
      background: rgba(28,28,36,0.78); border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.4); opacity: 0.45; transition: opacity 0.2s, transform 0.2s;
    }
    .sigma-home-pill:hover { opacity: 1; transform: translateY(-1px); color: #fff; }
  </style>
</head>
<body>
  <canvas id="filmcraft_canvas"></canvas>
  <div id="loading"><div id="status">Loading FilmCraft…</div></div>
  <div id="fatal" role="alertdialog" aria-labelledby="fatal-title">
    <div class="box">
      <h1 id="fatal-title">FilmCraft stopped working</h1>
      <div>Unsaved changes are kept in the browser every few seconds and come back when you reload.</div>
      <pre id="fatal-msg"></pre>
      <button id="fatal-reload" type="button">Reload</button>
    </div>
  </div>
  <a href="../Main/index.html" class="sigma-home-pill" title="Back to Sigma Webapps">⌂ Home</a>
  <script src="filmcraft_web.js"></script>
  <script>
    window.filmcraftLoad = {};
    let lastPanic = null;
    const consoleError = console.error.bind(console);
    console.error = (...a) => {
      const m = a.map(String).join(" ");
      if (/panicked at|memory allocation of/.test(m)) lastPanic = m;
      consoleError(...a);
    };
    window.filmcraftFatal = (what) => {
      if (window.filmcraftLoad.fatal) return;
      const msg = lastPanic || String(what && (what.stack || what.message) || what);
      window.filmcraftLoad.fatal = msg;
      const el = document.getElementById("fatal");
      document.getElementById("fatal-msg").textContent = msg.split("\n\nStack:")[0];
      el.classList.add("on");
    };
    document.getElementById("fatal-reload").onclick = () => location.reload();
    const isFatal = (e) => e instanceof WebAssembly.RuntimeError || /panicked at|unreachable|memory access out of bounds/.test(String(e && e.message || e));
    addEventListener("error", (ev) => { if (window.filmcraftLoad.readyMs && isFatal(ev.error || ev.message)) window.filmcraftFatal(ev.error || ev.message); });
    addEventListener("unhandledrejection", (ev) => { if (window.filmcraftLoad.readyMs && isFatal(ev.reason)) window.filmcraftFatal(ev.reason); });

    (async function bootFilmCraft() {
      if (!location.search.includes("webgl")) {
        let useWebGL = false;
        try {
          const adapter = navigator.gpu ? await navigator.gpu.requestAdapter() : null;
          if (!adapter) useWebGL = true;
        } catch (_) { useWebGL = true; }
        if (useWebGL) {
          try {
            const u = new URL(location.href);
            u.searchParams.set("webgl", "1");
            history.replaceState(null, "", u.toString());
          } catch (_) {}
        }
      }
      async function decodeGzipB64(b64) {
        const bin = atob(b64);
        const gzBytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) gzBytes[i] = bin.charCodeAt(i);
        const ds = new DecompressionStream("gzip");
        const writer = ds.writable.getWriter();
        writer.write(gzBytes);
        writer.close();
        const buf = await new Response(ds.readable).arrayBuffer();
        return new Uint8Array(buf);
      }
      async function loadInlineFallback() {
        await new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "filmcraft_wasm_gz.js";
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
        const bytes = await decodeGzipB64(window.__WASM_GZ_B64);
        delete window.__WASM_GZ_B64;
        await wasm_bindgen(bytes);
      }
      try {
        const t0 = performance.now();
        if (location.protocol === "file:") {
          await loadInlineFallback();
        } else {
          try {
            await wasm_bindgen("./filmcraft_web_bg.wasm");
          } catch (_) {
            await loadInlineFallback();
          }
        }
        window.filmcraftLoad.wasmMs = performance.now() - t0;
        await wasm_bindgen.start("filmcraft_canvas");
        window.filmcraftLoad.readyMs = performance.now() - t0;
      } catch (e) {
        const text = String(e && e.stack || e);
        window.filmcraftLoad.error = String(e);
        const s = document.getElementById("status");
        if (s) { s.className = "err"; s.textContent = "FilmCraft failed to start:\n" + text; }
        console.error(e);
      }
    })();
  </script>
</body>
</html>
