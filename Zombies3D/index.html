<!doctype html>
<html lang="en-us">
  <head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name=viewport content="width=device-width, initial-scale=1">
	<meta content="Nazi Zombies: Portable" property="og:title" />
	<meta content="Call of Duty: Zombies de-make, now in your browser via WebGL!" property="og:description" />
	<meta content="#6e0d00" name="theme-color" />
	<title>NZ: Portable</title>
	<link rel="icon" href="nzportable.ico">
	<style>
	html,body { background-color:#000000; color:#808080; height:100%;width:100%;margin:0;padding:0; overflow:hidden; font-family: system-ui, -apple-system, sans-serif; }
	.emscripten { padding-right: 0; margin-left: auto; margin-right: auto; display: block; }
	div.emscripten { text-align: center; padding:0; margin: 0;}
	/* the canvas *must not* have any border or padding, or mouse coords will be wrong */
	canvas.emscripten { border: 0px none; width:100%; height:100%; padding:0; margin: 0;}
	.sigma-home-pill {
		position: fixed; bottom: 12px; right: 12px; z-index: 9999;
		padding: 5px 12px; border-radius: 999px; font: 600 12px system-ui, -apple-system, sans-serif;
		color: rgba(245,245,247,0.88); text-decoration: none;
		background: rgba(28,28,36,0.78); border: 1px solid rgba(255,255,255,0.18);
		backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
		box-shadow: 0 4px 14px rgba(0,0,0,0.4); opacity: 0.45; transition: opacity 0.2s, transform 0.2s;
	}
	.sigma-home-pill:hover { opacity: 1; transform: translateY(-1px); color: #fff; }
	</style>
  </head>
  <body ondrop="gotdrop(event);" ondragover="event.preventDefault()">
	<div class="emscripten" id="status">Please allow/unblock our javascript to play.</div>
	<div id="dropzone" ondrop="gotdrop(event);" ondragover="event.preventDefault()" hidden=1>Drop Zone</div>
	<button type="button" onclick="begin()" id="begin" hidden=1>Click To Begin!</button>
	<div class="emscripten">
		<progress value="0" max="100" id="progress" hidden=1></progress>  
	</div>
	<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>
	<a href="../Main/index.html" class="sigma-home-pill" title="Back to Sigma Webapps">⌂ Home</a>
	<script type='text/javascript'>
var DEFAULT_FMF_TEXT = 'game nzp\nname "Nazi Zombies Portable"\nbasegame nzp\nmainconfig "nzportable.cfg"\ndisablehomedir 1\n';

var Module = {
	files:
	{
		"default.fmf" : "default.fmf",
		"nzp/game.pk3" : "nzp/game.pk3",
		"nzp/progs.pk3" : "nzp/progs.pk3"
	},
	print: function(msg)
	{
		console.log(msg);
	},
	printErr: function(text)
	{
		console.log(text);
	},
	canvas: document.getElementById('canvas'),
	setStatus: function(text)
	{
		if (Module.setStatus.interval)
			clearInterval(Module.setStatus.interval);
		var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
		var statusElement = document.getElementById('status');
		var progressElement = document.getElementById('progress');
		if (m) {
			text = m[1];
			progressElement.value = parseInt(m[2])*100;
			progressElement.max = parseInt(m[4])*100;
			progressElement.hidden = false;
		} else {
			progressElement.value = null;
			progressElement.max = null;
			progressElement.hidden = true;
		}
		statusElement.innerHTML = text;
		statusElement.hidden = text.length==0;
	},
	totalDependencies: 0,
	monitorRunDependencies: function(left)
	{
		this.totalDependencies = Math.max(this.totalDependencies, left);
		Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
	},
	postRun:
	[
		function()
		{
			if (Module["sched"] === undefined)
			{
				alert("Unable to initialise. You may need to restart your browser. If you get this often and inconsistently, consider using a 64bit browser instead.");
				Module.setStatus("Initialisation Failure");
			}
		}
	],
};

function loadScript(src) {
	return new Promise(function(resolve, reject) {
		var s = document.createElement('script');
		s.src = src;
		s.onload = resolve;
		s.onerror = reject;
		document.head.appendChild(s);
	});
}

function b64ToBytes(b64) {
	var bin = atob(b64);
	var len = bin.length;
	var bytes = new Uint8Array(len);
	for (var i = 0; i < len; i++) {
		bytes[i] = bin.charCodeAt(i);
	}
	return bytes;
}

async function decodeGzipB64(b64) {
	var gzBytes = b64ToBytes(b64);
	var ds = new DecompressionStream("gzip");
	var writer = ds.writable.getWriter();
	writer.write(gzBytes);
	writer.close();
	return await new Response(ds.readable).arrayBuffer();
}

async function prepareFileProtocolAssets() {
	Module.setStatus("Loading local engine & archives (1/5)...");
	await loadScript("ftewebgl_wasm_gz.js");
	Module.wasmBinary = await decodeGzipB64(window.__NZP_WASM_GZ);
	delete window.__NZP_WASM_GZ;

	Module.setStatus("Loading local game logic (2/5)...");
	await loadScript("nzp/progs_b64.js");
	var progsBytes = b64ToBytes(window.__NZP_PROGS_B64);
	delete window.__NZP_PROGS_B64;

	Module.setStatus("Loading local game assets (3/5)...");
	await loadScript("nzp/game_part0.js");
	var p0 = b64ToBytes(window.__NZP_GAME_PART_0);
	delete window.__NZP_GAME_PART_0;

	Module.setStatus("Loading local game assets (4/5)...");
	await loadScript("nzp/game_part1.js");
	var p1 = b64ToBytes(window.__NZP_GAME_PART_1);
	delete window.__NZP_GAME_PART_1;

	Module.setStatus("Loading local game assets (5/5)...");
	await loadScript("nzp/game_part2.js");
	var p2 = b64ToBytes(window.__NZP_GAME_PART_2);
	delete window.__NZP_GAME_PART_2;

	var gameBytes = new Uint8Array(p0.byteLength + p1.byteLength + p2.byteLength);
	gameBytes.set(p0, 0);
	gameBytes.set(p1, p0.byteLength);
	gameBytes.set(p2, p0.byteLength + p1.byteLength);
	p0 = null; p1 = null; p2 = null;

	var fmfBytes = new TextEncoder().encode(DEFAULT_FMF_TEXT);
	Module.files["default.fmf"] = fmfBytes.buffer;
	Module.files["nzp/progs.pk3"] = progsBytes.buffer;
	Module.files["nzp/game.pk3"] = gameBytes.buffer;
}

async function begin()
{
	if (Module.began)
		return;
	Module.began = true;
	document.getElementById('dropzone').hidden = true;
	document.getElementById('begin').hidden = true;
	Module.setStatus('Downloading...');

	if (window.location.protocol === 'file:') {
		try {
			await prepareFileProtocolAssets();
		} catch (e) {
			console.error("Failed to load local NZ:P assets:", e);
			Module.setStatus("Unable to load local game files: " + (e && e.message || e));
			return;
		}
	}

	var s = document.createElement('script');
	s.setAttribute('src',"ftewebgl.js");
	s.setAttribute('type',"text/javascript");
	s.setAttribute('charset',"utf-8");
	s.addEventListener('error', function() {alert("Oh noes! we got an error!"); Module.setStatus("Unable to download engine javascript");}, false);
	document.head.appendChild(s);
}

function fixupfilepath(fname, path)
{
	if (path != "")
		return path+fname;
	var ext = fname.substr(fname.lastIndexOf('.') + 1);
	if (ext == 'fmf' || ext == 'kpf')
		return fname;
	if (ext == 'bsp' || ext == 'map' || ext == 'lit' || ext == 'lux')
		return "id1/maps/" + fname;
	return "id1/" + fname;
}
function showfiles()
{
	if (Module.began)
		return;
	Module.setStatus('');
	document.getElementById('dropzone').hidden = false;
	document.getElementById('begin').hidden = false;
	var nt = "Drag gamedirs or individual package files here to make them available!<br/>Active Files:<br/><pre>";
	var keys = Object.keys(Module.files);
	for(var i = 0; i < keys.length; i++)
	{
		if (Module.files[keys[i]] instanceof ArrayBuffer)
		{
			var sz = Module.files[keys[i]].byteLength;
			if (sz > 512*1024)
				sz = (sz / (1024*1024)) + "mb";
			else if (sz > 512)
				sz = (sz / 1024) + "kb";
			else
				sz = (sz) + " bytes";
			nt += "    " + keys[i] + " ("+sz+")<br/>";
		}
		else
			nt += "    " + keys[i] + "<br/>";
	}
	nt += "</pre>("+keys.length+" files)";
	document.getElementById('dropzone').innerHTML = nt;
}
function scanfiles(item,path)
{
	if (item.isFile)
	{
		item.file(function(f)
		{
			let n = fixupfilepath(f.name, path);
			Module.files[n]=f.arrayBuffer();
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});
    	});
	}
	else if (item.isDirectory)
	{
		var dirReader = item.createReader();
		dirReader.readEntries(function(entries)
		{
			for (var i=0; i<entries.length; i++)
				scanfiles(entries[i], path + item.name + "/");
		});
	}
}
function gotdrop(ev)
{
	ev.preventDefault();
	for (var i = 0; i < ev.dataTransfer.items.length; i++)
		if (ev.dataTransfer.items[i].webkitGetAsEntry)
		{
			var d = ev.dataTransfer.items[i].webkitGetAsEntry();
			if (d)
				scanfiles(d, "");
		}
		else if (ev.dataTransfer.items[i].kind === 'file')
		{
			var f = ev.dataTransfer.items[i].getAsFile();
			var n = fixupfilepath(f.name);
			Module.files[n]=f.arrayBuffer();
			Module.files[n].then(buf=>{Module.files[n]=buf;showfiles();});
		}
	showfiles();
}
if (window.location.hash != "" || Object.keys(Module.files).length)
	begin();
else
	showfiles();
	</script>
  </body>
</html>
